name: Validate

on:
  push:
  pull_request:

jobs:
  skill-and-zig:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          mkdir -p /tmp/zig
          tar -xf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo /tmp/zig >> "$GITHUB_PATH"

      - name: Validate skill metadata
        run: |
          npx --yes skills add . --skill zig-dev --list

      - name: Validate Zig C interop fixture
        working-directory: tests/zig-0.16-c-interop-addtranslatec
        run: |
          zig version
          zig fmt --check build.zig src/main.zig
          zig ast-check build.zig
          zig build
          zig build run
          zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSmall
          zig cc -target x86_64-linux-musl -c src/answer.c -I include -o /tmp/answer.o
